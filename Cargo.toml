[package]
name = "eztran"
version = "0.3.0"
edition = "2021"
description = "A lightweight desktop translation tool built with egui"

[[bin]]
name = "eztran"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
minreq = { version = "2", features = ["https-rustls", "json-using-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
dirs = "5"
anyhow = "1"
thiserror = "2"
tray-icon = "0.25"
log = "0.4"
simplelog = "0.12"
chrono = "0.4"
sha2 = "0.10"
md-5 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
